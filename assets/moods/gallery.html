<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ms. Minutes Moods</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #efe3c6; color: #3a2616; font-family: "Futura", "Avenir Next", sans-serif; }
  h1 { text-align: center; letter-spacing: .2em; text-transform: uppercase; font-size: 20px; margin: 0 0 6px; }
  p { text-align: center; margin: 0 0 28px; font-family: "American Typewriter", serif; opacity: .75; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; max-width: 1100px; margin: 0 auto; }
  figure { margin: 0; background: #fbf3df; border: 2px solid #4a1a0a; border-radius: 16px; padding: 12px 12px 14px; box-shadow: 4px 5px 0 rgba(74,26,10,.25); text-align: center; }
  img { width: 100%; height: auto; display: block; }
  figcaption b { display: block; letter-spacing: .18em; text-transform: uppercase; font-size: 14px; color: #e8762c; }
  figcaption span { font-family: "Menlo", monospace; font-size: 12px; opacity: .7; }
</style></head><body>
<h1>Ms. Minutes · Mood Chart</h1>
<p>Her mood follows how much of your most urgent task's time has passed.</p>
<div class="grid">
  <figure><img src="happy.png" alt="Happy"><figcaption><b>Happy</b><span>0–50% · NOMINAL</span></figcaption></figure>
  <figure><img src="skeptical.png" alt="Skeptical"><figcaption><b>Skeptical</b><span>50–75% · DIVERGING</span></figcaption></figure>
  <figure><img src="annoyed.png" alt="Annoyed"><figcaption><b>Annoyed</b><span>75–90% · UNSTABLE</span></figcaption></figure>
  <figure><img src="angry.png" alt="Angry"><figcaption><b>Angry</b><span>90–100% · CRITICAL</span></figcaption></figure>
  <figure><img src="furious.png" alt="Furious"><figcaption><b>Furious</b><span>Overdue · NEXUS EVENT</span></figcaption></figure>
  <figure><img src="proud.png" alt="Proud"><figcaption><b>Proud</b><span>All done · PRISTINE</span></figcaption></figure>
</div>
</body></html>
